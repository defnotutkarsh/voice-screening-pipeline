[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-screening-pipeline"
version = "0.1.0"
description = "Resume PDFs in, a voice-agent call sheet out, call results back: the data plumbing around an AI phone-screening agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
voice-screening = "voice_screening.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Gemini API; needs GEMINI_API_KEY (skipped otherwise)"]
