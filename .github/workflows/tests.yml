name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poppler (provides pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -e ".[dev]"
      - run: pytest -q
